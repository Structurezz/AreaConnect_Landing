<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page-specific tags (title, description, canonical, robots, Open Graph,
      Twitter, breadcrumbs, FAQ/pricing schema) come from <Seo> on each page
      and are baked into static HTML per route by scripts/prerender.mjs.
      Only site-wide tags live here.
    -->
    <!--app-head-->
    <meta name="author" content="AreaConnect Technologies" />
    <meta name="format-detection" content="telephone=no" />

    <!--GOOGLE_TAGS_HERE-->

    <!-- ── Icons ─────────────────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10B981" />
    <meta name="msapplication-TileColor" content="#10B981" />

    <!-- ── Site-wide structured data ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://areaconnect.pro/#organization",
      "name": "AreaConnect",
      "alternateName": ["Area Connect", "AreaConnect Technologies"],
      "url": "https://areaconnect.pro/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://areaconnect.pro/logo-512.png",
        "width": 512,
        "height": 512
      },
      "description": "Estate management platform for Nigerian communities, connecting estate managers, residents and security staff.",
      "foundingLocation": { "@type": "Place", "name": "Lagos, Nigeria" },
      "areaServed": { "@type": "Country", "name": "Nigeria" },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "michael@areaconnect.pro",
        "telephone": "+234-708-922-4054",
        "contactType": "customer support",
        "areaServed": "NG",
        "availableLanguage": "English"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://areaconnect.pro/#website",
      "name": "AreaConnect",
      "alternateName": "Area Connect",
      "url": "https://areaconnect.pro/",
      "inLanguage": "en-NG",
      "publisher": { "@id": "https://areaconnect.pro/#organization" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://areaconnect.pro/#software",
      "name": "AreaConnect",
      "alternateName": "Area Connect Estate Management",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "url": "https://areaconnect.pro/",
      "description": "All-in-one estate management platform for Nigerian communities. Visitor QR passes, resident portal, service charge collection, gate security app, community chat and marketplace.",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "20000",
        "highPrice": "80000",
        "priceCurrency": "NGN",
        "offerCount": "3"
      },
      "publisher": { "@id": "https://areaconnect.pro/#organization" }
    }
    </script>

    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
